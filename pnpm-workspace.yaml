packages:
  - apps/*
  - apps/fixtures/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

catalogMode: prefer

catalog:
  "@apical-ts/craft": 0.26.1
  "@babel/parser": ^8.0.6
  "@readme/openapi-parser": ^9.0.0
  "@standard-schema/spec": ^1.1.0
  "@types/node": ^24.13.6
  "@types/pg": ^8.23.1
  "@vitest/coverage-v8": 4.1.11
  drizzle-orm: ^0.45.3
  hono: ^4.13.8
  pactum: ^3.9.1
  pg: ^8.23.0
  pure-rand: ^8.4.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  zod: ^4.6.5
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - drizzle-orm@0.45.3
