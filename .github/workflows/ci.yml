name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three jobs, no `needs:` — they run in parallel.
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          # Resolves vite-plus from package.json catalog → pnpm-workspace.yaml.
          cache: true
          node-version: "24"

      - name: Build, lint, typecheck, unit tests, and coverage
        # Hexkit only (`packages/*` + `apps/cli`). Dogfood apps are out of scope.
        # `vp run --filter` cannot be combined with `-r`.
        # Build must precede tests because workspace packages export from dist/.
        run: |
          vp run --filter './packages/*' --filter './apps/cli' --fail-if-no-match build
          vp check
          vp run --filter './packages/*' --filter './apps/cli' --fail-if-no-match test
          vp run coverage

  dogfood-api:
    name: Dogfood API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true
          node-version: "24"

      - name: Generate Hono Pet Shop, lint, typecheck, build, and Pactum
        # hexkit generate → generated app `vp lint` + `tsc` → Compose image build
        # → Pactum (`apps/petstore-sample/tests/api.test.ts`).
        run: vp run dogfood

  dogfood-nextjs:
    name: Dogfood NextJS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true
          node-version: "24"

      - name: Generate Next Pet Shop, lint, typecheck, and build
        # hexkit generate --http next → eslint-config-next + `next build`.
        # No app tests; skip Compose/runtime smoke in CI.
        env:
          HEXKIT_SKIP_COMPOSE: "1"
        run: vp run dogfood-petstore-next
