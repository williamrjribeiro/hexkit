openapi: 3.1.0
info:
  title: Hexkit Petstore PoC
  version: 1.0.0
paths:
  /pet:
    post:
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    put:
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - $ref: "#/components/parameters/PetId"
      security:
        - api_key: []
      responses:
        "200":
          description: Pet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    delete:
      operationId: deletePet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Pet deleted
    post:
      operationId: updatePetWithForm
      x-hexkit:
        operation:
          aggregate: Pet
          action: update
      parameters:
        - $ref: "#/components/parameters/PetId"
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
      responses:
        "200":
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid input
        "404":
          description: Pet not found
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - available
                - pending
                - sold
          style: form
          explode: true
      responses:
        "200":
          description: Pets matching status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid status value
  /pet/findByTags:
    get:
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Pets matching tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid tag value
  /store/order:
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /store/order/{orderId}:
    get:
      operationId: getOrderById
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    delete:
      operationId: deleteOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Order deleted
  /user:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /user/createWithList:
    post:
      operationId: createUsersWithListInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
      responses:
        "200":
          description: First created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /user/login:
    get:
      operationId: loginUser
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
        - name: password
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Login token
          headers:
            X-Rate-Limit:
              description: Calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: Date in UTC when the token expires
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Invalid username or password
  /user/logout:
    get:
      operationId: logoutUser
      responses:
        "200":
          description: Logged out
  /user/{username}:
    get:
      operationId: getUserByName
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    put:
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    Pet:
      type: object
      x-hexkit:
        persistence:
          table: pets
          identity: id
      required:
        - id
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        category:
          $ref: "#/components/schemas/Category"
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    Order:
      type: object
      x-hexkit:
        persistence:
          table: orders
          identity: id
      required:
        - id
        - petId
        - quantity
        - status
        - complete
      properties:
        id:
          type: integer
          format: int32
        petId:
          type: integer
          format: int32
          x-hexkit:
            reference:
              schema: Pet
              property: id
        quantity:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
    User:
      type: object
      x-hexkit:
        persistence:
          table: users
          identity: id
      required:
        - id
        - username
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        userStatus:
          type: integer
          format: int32
          description: User Status
