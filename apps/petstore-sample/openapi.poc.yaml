openapi: 3.1.0
info:
  title: Hexkit Petstore PoC
  version: 1.0.0
paths:
  /pet:
    post:
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    put:
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Pet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    delete:
      operationId: deletePet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Pet deleted
  /store/order:
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /store/order/{orderId}:
    get:
      operationId: getOrderById
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    delete:
      operationId: deleteOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Order deleted
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
    Order:
      type: object
      required:
        - id
        - petId
        - quantity
        - status
        - complete
      properties:
        id:
          type: integer
          format: int32
        petId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
