openapi: 3.1.0
info:
  title: Hexkit Library API
  version: 1.0.0
paths:
  /books:
    post:
      operationId: createBook
      x-hexkit:
        operation:
          aggregate: Book
          action: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /books/{bookId}:
    get:
      operationId: getBook
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Book not found
components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    Author:
      type: object
      x-hexkit:
        persistence:
          table: authors
          identity: id
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    Book:
      type: object
      x-hexkit:
        persistence:
          table: books
          identity: id
      required:
        - id
        - authorId
        - title
      properties:
        id:
          type: integer
          format: int32
        authorId:
          type: integer
          format: int32
          x-hexkit:
            reference:
              schema: Author
              property: id
        title:
          type: string
